[project]
name = "math-representation-predictors"
version = "0.1.0"
description = "Hidden-state geometry of equivalent mathematical statements"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Extraction versions recorded in the public activation archive.
    "torch==2.11.0",
    "transformers==5.15.1",
    "datasets==5.0.1",
    "huggingface-hub==1.32.0",
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
    "sentencepiece>=0.2,<0.3",
    "protobuf>=5,<8",
    "accelerate>=1,<2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
